/* Layout: sticky preview stage on the right, plain stacked controls on the left; on a phone the stage comes first. */
:root{
  --bg:#f2f3ff; --panel:#ffffff; --fg:#2a2d55; --muted:#5f6396; --line:#d9dcf5;
  --navy:#454a7f; --lav:#8f9bde; --accent:#ff6f7d; --accent-fg:#ffffff;
  --check-a:#ffffff; --check-b:#e6e8fb;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171933; --panel:#20234a; --fg:#e8eaff; --muted:#a3a8dc; --line:#343869;
  --check-a:#262a55; --check-b:#2d3161; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171933; --panel:#20234a; --fg:#e8eaff; --muted:#a3a8dc; --line:#343869;
  --check-a:#262a55; --check-b:#2d3161; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);margin:0;color:var(--navy);letter-spacing:.01em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:#c9d0ff}}
:root[data-theme="dark"] h1{color:#c9d0ff}
header p{margin:0;color:var(--muted)}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;min-width:0}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px;min-width:0}
legend{font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:6px}
label{display:grid;gap:4px;font-weight:700;font-size:13px;min-width:0}
label .row{display:flex;justify-content:space-between;gap:8px}
label .val{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
input[type=text],select{width:100%;font:inherit;font-weight:600;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
input[type=text]:focus-visible,select:focus-visible,button:focus-visible,input[type=range]:focus-visible,input[type=color]:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--navy)}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--navy)}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=color]{width:100%;height:38px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);padding:3px;cursor:pointer}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.preset{border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 12px 5px 6px;font:inherit;font-weight:700;font-size:13px;display:flex;gap:7px;align-items:center;cursor:pointer}
.preset i{width:20px;height:20px;border-radius:50%;display:block;border:3px solid;box-sizing:border-box}
.preset:hover{border-color:var(--lav)}
.stage{position:sticky;top:12px;display:grid;gap:12px;min-width:0}
.board{border:1px solid var(--line);border-radius:14px;padding:clamp(12px,3vw,28px);min-height:240px;display:grid;place-items:center;
  background-color:var(--check-a);background-image:linear-gradient(45deg,var(--check-b) 25%,transparent 25%,transparent 75%,var(--check-b) 75%),linear-gradient(45deg,var(--check-b) 25%,transparent 25%,transparent 75%,var(--check-b) 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.board canvas{max-width:100%;height:auto;display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.primary{font:inherit;font-weight:800;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:11px 20px;cursor:pointer;font-size:15px}
button.primary:hover{filter:brightness(1.06)}
button.ghost{font:inherit;font-weight:800;background:transparent;color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost:hover{border-color:var(--lav)}
.note{color:var(--muted);font-size:13px;margin:0}
.size{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-left:auto}
.fallback{display:none}
.fallback.on{display:block}
.fallback img{max-width:100%;border:1px dashed var(--line);border-radius:10px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.stage{position:static;order:-1}}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Yeeps Lettering</h1><p>Type anything. Get it back as chunky white letters with a navy outline, lavender 3D sides and the red pins.</p></header>

  <form class="controls" id="form" onsubmit="return false">
    <fieldset>
      <legend>Words</legend>
      <label for="main">Big text<input type="text" id="main" value="SPIDERYEEP12_VR" maxlength="40" autocomplete="off"></label>
      <label class="check"><input type="checkbox" id="caps" checked>All caps</label>
      <label for="sub">Small line<input type="text" id="sub" value="Made by" maxlength="40" autocomplete="off"></label>
      <label for="subpos">Small line goes<select id="subpos"><option value="top">above the big text</option><option value="bottom">below the big text</option></select></label>
    </fieldset>
    <fieldset>
      <legend>Shape</legend>
      <label for="font">Font<select id="font"><option value="Lilita One">Lilita One (the logo font)</option><option value="Londrina Solid">Londrina Solid (the in-game font)</option></select></label>
      <label for="chunk"><span class="row">Chunky<span class="val" id="chunkV"></span></span><input type="range" id="chunk" min="0" max="100" value="38"></label>
      <label for="track"><span class="row">Letter spacing<span class="val" id="trackV"></span></span><input type="range" id="track" min="-8" max="60" value="1"></label>
      <label for="depth"><span class="row">3D depth<span class="val" id="depthV"></span></span><input type="range" id="depth" min="0" max="100" value="55"></label>
      <label for="outline"><span class="row">Outline thickness<span class="val" id="outlineV"></span></span><input type="range" id="outline" min="8" max="60" value="38"></label>
    </fieldset>
    <fieldset>
      <legend>Pins</legend>
      <label class="check"><input type="checkbox" id="pins" checked>Show pins</label>
      <label for="pinsize"><span class="row">Pin size</span><input type="range" id="pinsize" min="40" max="110" value="85"></label>
      <label for="pinL">Left pin sits on top of<select id="pinL"></select></label>
      <label for="pinR">Right pin sits on top of<select id="pinR"></select></label>
    </fieldset>
    <fieldset>
      <legend>Colors</legend>
      <div class="presets" id="presets"></div>
      <div class="colors">
        <label for="cNavy">Outline<input type="color" id="cNavy" value="#454a7f"></label>
        <label for="cLav">3D sides<input type="color" id="cLav" value="#8f9bde"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Saved picture</legend>
      <label for="bg">Background<select id="bg"><option value="none">Transparent</option><option value="#ffffff">White</option><option value="#171933">Dark navy</option><option value="#8f9bde">Lavender</option></select></label>
    </fieldset>
    <button class="ghost" id="reset" type="button">Reset to default settings</button>
  </form>

  <section class="stage" aria-label="Preview">
    <div class="board" id="board"><canvas id="out" width="10" height="10" aria-label="Your lettering"></canvas></div>
    <div class="actions">
      <button class="primary" id="save" type="button">Save PNG</button>
      <button class="ghost" id="copy" type="button">Copy image</button>
      <span class="size" id="size"></span>
    </div>
    <p class="note" id="msg" role="status"></p>
    <div class="fallback" id="fb"><p class="note">Saving is blocked here. Press and hold or right-click the picture and save it.</p><img id="fbimg" alt="Your lettering"></div>
  </section>
</div>

const $=id=>document.getElementById(id);
const PRESETS=[["Yeeps","#454a7f","#8f9bde"],["Night","#14162e","#5d68c9"]];
const presetBox=$("presets");
PRESETS.forEach(([n,a,b])=>{const el=document.createElement("button");el.type="button";el.className="preset";el.innerHTML='<i style="background:'+b+';border-color:'+a+'"></i>'+n;
  el.onclick=()=>{$("cNavy").value=a;$("cLav").value=b;schedule()};presetBox.appendChild(el)});

function populatePins(force){
  const chars=[...($("caps").checked?$("main").value.trim().toUpperCase():$("main").value.trim())];
  let firstE=chars.findIndex(c=>c==="E"||c==="e"); if(firstE<0)firstE=Math.floor(chars.length*.6);
  let last=chars.length-1;
  [["pinL",firstE],["pinR",last]].forEach(([id,def])=>{
    const sel=$(id),old=sel.value;sel.innerHTML="";
    chars.forEach((c,i)=>{if(c.trim()===""&&c!==" ")return;if(c===" ")return;const o=document.createElement("option");o.value=i;o.textContent=c+"  ("+(i+1)+")";sel.appendChild(o)});
    const ok=!force&&sel.dataset.manual==='1'&&old!==""&&[...sel.options].some(o=>o.value===old);
    if(force)delete sel.dataset.manual;
    sel.value=ok?old:String(Math.max(0,Math.min(def,chars.length-1)));
  });
}
populatePins(true);
["pinL","pinR"].forEach(id=>$(id).addEventListener("change",()=>{$(id).dataset.manual='1'}));
$("main").addEventListener("input",()=>populatePins(false));$("caps").addEventListener("change",()=>populatePins(false));
let curFont="Lilita One";
const imgs={};
function loadImg(k,src){return new Promise(r=>{const i=new Image();i.onload=()=>{imgs[k]=i;r()};i.src=src})}
const ready=Promise.all([loadImg("L",PIN_L),loadImg("R",PIN_R)]);

const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const css=c=>"rgb("+c.join(",")+")";
const mk=(w,h)=>{const c=document.createElement("canvas");c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c};

function tint(src,color){const c=mk(src.width,src.height),x=c.getContext("2d");x.fillStyle=color;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation="destination-in";x.drawImage(src,0,0);return c}

function renderLine(text,size,track,o,endsPx,navy,lav,bub,chunk){
  const gx0=size*.07*(chunk||0);
  const font=size+'px "'+curFont+'"';
  const m=mk(8,8).getContext("2d");m.font=font;
  const chars=[...text];let adv=[],tw=0;
  const cen=[];chars.forEach(ch=>{const cw=m.measureText(ch).width+gx0*2;adv.push(tw);cen.push(tw+cw/2);tw+=cw+track});tw-=track;
  const tm=m.measureText(text),cap=m.measureText("H").actualBoundingBoxAscent;
  const asc=Math.max(tm.actualBoundingBoxAscent,cap)+gx0,desc=Math.max(tm.actualBoundingBoxDescent,2)+gx0;
  const pad=Math.ceil(o+endsPx+14);
  const W=tw+pad*2,H=asc+desc+pad*2;
  const M=mk(W,H),mx=M.getContext("2d");mx.font=font;mx.fillStyle="#fff";mx.textBaseline="alphabetic";
  mx.strokeStyle="#fff";mx.lineJoin="round";mx.lineWidth=gx0*2;
  chars.forEach((ch,i)=>{mx.fillText(ch,pad+adv[i]+gx0,pad+asc-gx0);if(gx0>0)mx.strokeText(ch,pad+adv[i]+gx0,pad+asc-gx0)});
  if(bub>0){ // round every corner: blur, then snap the edge back to crisp
    const br=Math.max(1,Math.round(size*.045*bub)),T=mk(M.width,M.height),tx=T.getContext("2d");
    tx.filter="blur("+br+"px)";tx.drawImage(M,0,0);
    const id=tx.getImageData(0,0,T.width,T.height),p=id.data;
    for(let q=0;q<p.length;q+=4){const a=(p[q+3]-120)*10;p[q]=p[q+1]=p[q+2]=255;p[q+3]=a<0?0:a>255?255:a}
    mx.clearRect(0,0,M.width,M.height);tx.filter="none";tx.putImageData(id,0,0);mx.drawImage(T,0,0);
  }
  const near=mix(lav,[255,255,255],.12),far=mix(lav,[20,20,70],.14);
  const tmax=tw>0?endsPx/(tw/2):0, n=22, vx=M.width/2, vy=M.height/2;
  const E=mk(M.width,M.height),ex=E.getContext("2d");
  for(let k=n;k>=1;k--){
    const s=1-tmax*k/n, t=tint(M,css(mix(near,far,k/n)));
    ex.setTransform(s,0,0,s,vx*(1-s),vy*(1-s));ex.drawImage(t,0,0);
  }
  ex.setTransform(1,0,0,1,0,0);
  const U=mk(M.width,M.height),ux=U.getContext("2d");ux.drawImage(E,0,0);ux.drawImage(M,0,0);
  const UN=tint(U,css(navy)),O=mk(M.width,M.height),ox=O.getContext("2d");
  [[o,56],[o*.62,28],[o*.3,16]].forEach(([r,cnt])=>{for(let i=0;i<cnt;i++){const a=i/cnt*Math.PI*2;ox.drawImage(UN,Math.cos(a)*r,Math.sin(a)*r)}});
  ox.drawImage(UN,0,0);
  // face: pale blue rim on the bottom edge, then white lifted by a few px
  const F=mk(M.width,M.height),fx=F.getContext("2d");
  fx.drawImage(tint(M,"rgb(205,220,255)"),0,0);
  const up=mk(M.width,M.height),upx=up.getContext("2d");
  if(bub>0){ // puffy: white in the middle, easing to pale lavender at the edges, plus a glossy streak
    upx.filter="blur("+Math.round(size*.06*bub+2)+"px)";upx.drawImage(tint(M,"#fff"),0,-size*.015);upx.filter="none";
    upx.globalCompositeOperation="destination-in";upx.drawImage(M,0,0);fx.drawImage(up,0,0);
    const g=mk(M.width,M.height),gx=g.getContext("2d");gx.filter="blur("+Math.round(size*.02+1)+"px)";
    gx.drawImage(tint(M,"#fff"),size*.02,size*.03);gx.globalCompositeOperation="destination-out";gx.drawImage(tint(M,"#000"),size*.03,size*.07);
    gx.globalCompositeOperation="destination-in";gx.filter="none";gx.drawImage(M,0,0);fx.globalAlpha=.9;fx.drawImage(g,0,0);fx.globalAlpha=1;
  }else{
    upx.drawImage(tint(M,"#fff"),0,-Math.max(3,size/60));
    upx.globalCompositeOperation="destination-in";upx.drawImage(M,0,0);fx.drawImage(up,0,0);
  }
  const L=mk(M.width,M.height),lx=L.getContext("2d");lx.drawImage(O,0,0);lx.drawImage(E,0,0);lx.drawImage(F,0,0);
  return {cen,L,O,E,F,W:M.width,H:M.height,pad,tw,capTop:pad+asc-gx0-cap-gx0,base:pad+asc-gx0};
}

const recolored={};
function pinSprite(key,navy){
  const ck=key+css(navy);if(recolored[ck])return recolored[ck];
  const src=imgs[key],c=mk(src.width,src.height),x=c.getContext("2d");x.drawImage(src,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){const dr=p[i]-69,dg=p[i+1]-74,db=p[i+2]-127;if(dr*dr+dg*dg+db*db<1400){p[i+3]=0}}
  x.putImageData(d,0,0);return recolored[ck]=c;
}

let lastCanvas=null;
async function render(){
  await ready;
  const mainRaw=$("main").value.trim(),subRaw=$("sub").value.trim();
  const main=$("caps").checked?mainRaw.toUpperCase():mainRaw;
  try{curFont=$("font").value;await document.fonts.load('300px "'+curFont+'"',main+subRaw+"H")}catch(e){}
  const navy=hex($("cNavy").value),lav=hex($("cLav").value);
  const SIZE=300,track=+$("track").value*SIZE/150,o=+$("outline").value*SIZE/300;
  const depth=+$("depth").value/100*0.35;
  ["track","depth","outline","chunk"].forEach(k=>$(k+"V").textContent=$(k).value);
  const lines=[];
  const bub=0,chunk=+$("chunk").value/100;
  const mainL=main?renderLine(main,SIZE,track,o,depth*SIZE,navy,lav,bub,chunk):null;
  const subSize=SIZE*.58;
  const subL=subRaw?renderLine(subRaw,subSize,track*.58,o*.62,depth*subSize,navy,lav,bub,chunk*.45):null;
  if(!mainL&&!subL){const c=$("out");c.width=10;c.height=10;c.getContext("2d").clearRect(0,0,10,10);return}
  const top=$("subpos").value==="top";
  // pin placement: keep pin heads clear of a small line sitting above the big one
  const K=SIZE/300*.95; let raise=0, uL=0, uR=0;
  if(mainL){
    const tw=mainL.tw, lim=tw/2*.96; const clampU=u=>Math.max(-lim,Math.min(lim,u));
    const ci=i=>mainL.cen[Math.min(Math.max(+i||0,0),mainL.cen.length-1)]-tw/2; uL=ci($("pinL").value); uR=ci($("pinR").value);
    if(top&&subL&&$("pins").checked){
      const hs=subL.tw/2+o*.62+10;
      const clearL=u=>(u-161*K>=hs)||(u<=-hs), clearR=u=>(u+25*K>=hs)||(u+230*K<=-hs);
      if(!clearL(uL)||!clearR(uR))raise=SIZE*.55;   // pins stay where the sliders put them; the small line moves up instead
    }
  }
  const order=top?[subL,mainL]:[mainL,subL];
  const act=order.filter(Boolean);
  const gap=-(mainL?mainL.H:0)*.04;
  const MARGIN=Math.ceil(SIZE*1.2);
  const CW=Math.max(...act.map(l=>l.W))+Math.ceil(SIZE*1.6);
  let ys=[],y=MARGIN;
  act.forEach((l,i)=>{ if(i===0){ys.push(y)}else{const p=act[i-1];ys.push(ys[i-1]+p.base+SIZE*.2+(top?raise:0)-l.capTop)} y=ys[i]+l.H});
  const CH=y+40;
  const C=mk(CW,CH),cx=C.getContext("2d");
  let mainX=0,mainY=0;
  act.forEach((l,i)=>{const x=Math.round((CW-l.W)/2);if(!(l===mainL&&$("pins").checked))cx.drawImage(l.L,x,ys[i]);if(l===mainL){mainX=x;mainY=ys[i]}});
  if(mainL&&$("pins").checked){
    const k=K*(+$("pinsize").value/100),pl=pinSprite("L",navy),pr=pinSprite("R",navy);
    const cxm=mainX+mainL.pad+mainL.tw/2;
    const fd=mainL.F.getContext("2d").getImageData(0,0,mainL.W,mainL.H).data, FW=mainL.W;
    const solid=(x,y)=>x>=0&&x<FW&&y>=0&&y<mainL.H&&fd[(y*FW+x)*4+3]>200;
    // put each pin's tip on solid white face of the chosen letter, measured column by column
    const cw=idx=>{const c=mainL.cen,n=c.length;return Math.max(30,(idx>0&&idx<n-1?(c[idx+1]-c[idx-1])/2:(n>1?Math.abs(c[Math.min(idx+1,n-1)]-c[Math.max(idx-1,0)]):SIZE*.5))*.5)};
    const colTop=x=>{if(x<0||x>=FW)return null;let y=0;while(y<mainL.H&&!solid(x,y))y++;if(y>=mainL.H)return null;let e=y;while(e<mainL.H&&solid(x,e))e++;return {y,th:e-y}};
    const snap=(u,idx)=>{
      const x0=Math.round(cxm-mainX+u),half=Math.round(cw(+idx)*.9);let best=null;
      for(let d=0;d<=half;d+=3)for(const s of(d?[1,-1]:[1])){
        const x=x0+s*d,c=colTop(x);if(!c||c.th<SIZE*.12)continue;
        const sc=c.th-d*.4; if(!best||sc>best.sc)best={sc,x,y:c.y,th:c.th};
        if(c.th>=SIZE*.3&&d<=half*.6){return {x:x+mainX,y:c.y+mainY,th:c.th}}
      }
      if(best)return {x:best.x+mainX,y:best.y+mainY,th:best.th};
      return {x:x0+mainX,y:mainY+mainL.capTop,th:SIZE*.3};
    };
    const sl=snap(uL,$("pinL").value), sr=snap(uR,$("pinR").value);
    const tl={x:sl.x,y:sl.y+Math.min(SIZE*.2,sl.th*.45)}, tr={x:sr.x,y:sr.y+Math.min(SIZE*.24,sr.th*.5)};
    const hl={x:tl.x+(81-161)*k,y:tl.y+(82-239)*k}, hr={x:tr.x+(140-13)*k,y:tr.y+(102-286)*k};
    // one fused navy shape: text outline + pin blobs + the outline around each stick
    const NL=mk(CW,CH),nx=NL.getContext("2d");nx.drawImage(mainL.O,mainX,mainY);
    nx.fillStyle=nx.strokeStyle=css(navy);nx.lineCap="round";
    [[hl,tl,82],[hr,tr,102]].forEach(([h,tp,R])=>{nx.beginPath();nx.arc(h.x,h.y,R*k,0,Math.PI*2);nx.fill();
      nx.lineWidth=130*k;nx.beginPath();nx.moveTo(h.x,h.y);nx.lineTo(tp.x,tp.y);nx.stroke()});
    const BL=mk(CW,CH),bx=BL.getContext("2d");bx.filter="blur("+Math.round(o*.7)+"px)";bx.drawImage(NL,0,0);
    const bd=bx.getImageData(0,0,CW,CH),bp=bd.data;
    for(let q=3;q<bp.length;q+=4){const a=(bp[q]-118)*14;bp[q]=a<0?0:a>255?255:a}
    for(let q=0;q<bp.length;q+=4){bp[q]=navy[0];bp[q+1]=navy[1];bp[q+2]=navy[2]}
    bx.putImageData(bd,0,0);
    cx.drawImage(BL,0,0);
    cx.drawImage(pl,tl.x-161*k,tl.y-239*k,pl.width*k,pl.height*k);   // left pin goes behind the letter
    cx.drawImage(mainL.E,mainX,mainY);
    cx.drawImage(mainL.F,mainX,mainY);
    cx.drawImage(pr,tr.x-13*k,tr.y-286*k,pr.width*k,pr.height*k);
  }
  // crop to content
  const sm=mk(CW/4,CH/4),sx=sm.getContext("2d");sx.drawImage(C,0,0,sm.width,sm.height);
  const id=sx.getImageData(0,0,sm.width,sm.height).data;let x0=1e9,y0=1e9,x1=0,y1=0;
  for(let j=0;j<sm.height;j++)for(let i=0;i<sm.width;i++)if(id[(j*sm.width+i)*4+3]>8){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  const m=8,cx0=Math.max(0,x0*4-m),cy0=Math.max(0,y0*4-m),cw=Math.min(CW,(x1+1)*4+m)-cx0,ch=Math.min(CH,(y1+1)*4+m)-cy0;
  const bg=$("bg").value,out=$("out");
  out.width=cw;out.height=ch;const ox=out.getContext("2d");
  if(bg!=="none"){ox.fillStyle=bg;ox.fillRect(0,0,cw,ch)}
  ox.drawImage(C,cx0,cy0,cw,ch,0,0,cw,ch);
  $("size").textContent=cw+" × "+ch+" px";
  lastCanvas=out;$("fb").classList.remove("on");
}
let pending=0;
function schedule(){cancelAnimationFrame(pending);pending=requestAnimationFrame(()=>{render().catch(e=>{$("msg").textContent="Could not draw that: "+e.message})})}
document.querySelectorAll("#form input,#form select").forEach(el=>{el.addEventListener("input",schedule);el.addEventListener("change",schedule)});

const DEFAULTS={};
document.querySelectorAll("#form input,#form select").forEach(el=>{DEFAULTS[el.id]=el.type==="checkbox"?el.checked:el.value});
$("reset").onclick=()=>{
  Object.keys(DEFAULTS).forEach(id=>{if(id==="pinL"||id==="pinR")return;const el=$(id);if(el.type==="checkbox")el.checked=DEFAULTS[id];else el.value=DEFAULTS[id]});
  populatePins(true);
  schedule();say("Settings reset.");
};
function say(t){$("msg").textContent=t}
function toBlob(){return new Promise(r=>lastCanvas.toBlob(r,"image/png"))}
function showFallback(){lastCanvas&&($("fbimg").src=lastCanvas.toDataURL("image/png"));$("fb").classList.add("on")}
$("save").onclick=async()=>{
  if(!lastCanvas)return;
  const name=($("main").value.trim()||"yeeps").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||"yeeps";
  const blob=await toBlob();
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="yeeps-"+name+".png";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);say("Saved to your Downloads folder.");
};
$("copy").onclick=async()=>{
  if(!lastCanvas)return;
  try{await navigator.clipboard.write([new ClipboardItem({"image/png":toBlob()})]);say("Copied. Paste it anywhere.")}
  catch(e){showFallback();say("Copying is blocked here. Use the picture below.")}
};
render().catch(e=>{$("msg").textContent="Could not draw: "+e.message});
</script>
